<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Life Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Sign in · Life Tracker</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <script>try{var t=JSON.parse(localStorage.getItem('lifeTracker.theme'));if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;if(JSON.parse(localStorage.getItem('lifeTracker.background'))==='off')document.documentElement.dataset.bg='off';}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-bg" aria-hidden="true">
    <canvas class="hero-canvas" id="loginCanvas"></canvas>
  </div>

  <main class="card login-card" id="main">
    <div class="brand login-brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20c4.4 0 8-3.1 8-7.5 0-3.5-2.3-5-4.5-5-1.4 0-2.6.6-3.5 1.5C11.1 8.1 9.9 7.5 8.5 7.5 6.3 7.5 4 9 4 12.5 4 16.9 7.6 20 12 20Z"/><path d="M12 8c0-2 1-3.5 3-4.5"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Life Tracker</span>
        <span class="brand-sub">Personal</span>
      </span>
    </div>

    <h1 class="login-title">Sign in</h1>
    <p class="login-sub">Use your Google account to continue.</p>

    <div class="login-button-slot">
      <button type="button" id="googleButton" class="google-signin" disabled>
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.5 42.6 14.6 48 24 48z"/></svg>
        <span>Continue with Google</span>
      </button>
    </div>
    <p class="login-status" id="loginStatus" role="status" aria-live="polite"></p>
    <button type="button" id="loginRetry" class="secondary-btn" hidden>Try again</button>

    <p class="login-fine"></p>
  </main>

  <script src="background.js"></script>
  <script src="firebase-client.js"></script>
  <script src="login.js"></script>
</body>
</html>
