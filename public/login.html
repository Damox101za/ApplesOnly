<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Life Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%8E%3C/text%3E%3C/svg%3E">
  <script>try{var t=JSON.parse(localStorage.getItem('lifeTracker.theme'));if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;if(JSON.parse(localStorage.getItem('lifeTracker.background'))==='off')document.documentElement.dataset.bg='off';}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-bg" aria-hidden="true">
    <canvas class="hero-canvas" id="loginCanvas"></canvas>
  </div>

  <main class="card login-card" id="main">
    <div class="brand login-brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20c4.4 0 8-3.1 8-7.5 0-3.5-2.3-5-4.5-5-1.4 0-2.6.6-3.5 1.5C11.1 8.1 9.9 7.5 8.5 7.5 6.3 7.5 4 9 4 12.5 4 16.9 7.6 20 12 20Z"/><path d="M12 8c0-2 1-3.5 3-4.5"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Life Tracker</span>
        <span class="brand-sub">Personal</span>
      </span>
    </div>

    <h1 class="login-title">Sign in</h1>
    <p class="login-sub">Use your Google account to continue.</p>

    <div class="login-button-slot" id="googleButton"></div>
    <p class="login-status" id="loginStatus" role="status" aria-live="polite"></p>
    <button type="button" id="loginRetry" class="secondary-btn" hidden>Try again</button>

    <p class="login-fine">Your tasks, habits and journal stay on this device. Signing in only unlocks the app.</p>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="background.js"></script>
  <script src="login.js"></script>
</body>
</html>
