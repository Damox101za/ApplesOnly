<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Life Tracker</h1>
    <p class="subtitle">Habits, journal &amp; goals, all in one place.</p>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="habits">Habits</button>
    <button class="tab-btn" data-tab="journal">Journal</button>
    <button class="tab-btn" data-tab="goals">Goals</button>
  </nav>

  <main>
    <section id="dashboard" class="tab-panel active">
      <div class="card-grid" id="dashboardGrid"></div>
    </section>

    <section id="habits" class="tab-panel">
      <form id="habitForm" class="inline-form">
        <input type="text" id="habitInput" placeholder="New habit, e.g. Drink water" required>
        <button type="submit">Add Habit</button>
      </form>
      <ul class="item-list" id="habitList"></ul>
    </section>

    <section id="journal" class="tab-panel">
      <form id="journalForm" class="stacked-form">
        <div class="mood-picker" id="moodPicker">
          <button type="button" class="mood-btn" data-mood="😄">😄</button>
          <button type="button" class="mood-btn" data-mood="🙂">🙂</button>
          <button type="button" class="mood-btn" data-mood="😐">😐</button>
          <button type="button" class="mood-btn" data-mood="🙁">🙁</button>
          <button type="button" class="mood-btn" data-mood="😢">😢</button>
        </div>
        <textarea id="journalInput" placeholder="What's on your mind today?" rows="3" required></textarea>
        <button type="submit">Add Entry</button>
      </form>
      <ul class="item-list" id="journalList"></ul>
    </section>

    <section id="goals" class="tab-panel">
      <form id="goalForm" class="inline-form">
        <input type="text" id="goalInput" placeholder="New goal, e.g. Run a 5k" required>
        <input type="date" id="goalDate">
        <button type="submit">Add Goal</button>
      </form>
      <ul class="item-list" id="goalList"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
