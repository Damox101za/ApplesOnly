name: Tests

# Runs on every push and pull request, so a change that breaks something shows
# a red cross on GitHub before it is merged or deployed.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Server and data tests
    runs-on: ubuntu-latest
    services:
      # A real Redis, so the history script that runs inside Upstash is tested too.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm install
      - run: npm test
        env:
          REDIS_PORT: '6379'

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
